[workspace]
resolver = "2"
members = [
  "basics/*",
  "compression/*",
  "oracles/*",
  "pinocchio-helper",
  "tokens/*",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/HongThaiPham/solana-pinocchio-examples"
rust-version = "1.79"


[workspace.dependencies]
pinocchio = "0.11.2"
pinocchio-pubkey = "0.3.0"
pinocchio-log = "0.5.1"
pinocchio-system = "0.6.1"
pinocchio-token = "0.7.0"
bytemuck = { version = "1.23.0", features = ["derive", "min_const_generics"] }
pinocchio-associated-token-account = "0.4.0"


mollusk-svm = "0.3.0"
solana-sdk = "2.3.0"
solana-program-runtime = "=2.3.1"
